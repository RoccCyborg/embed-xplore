<path d="M95 520 H515 M685 520 H1105" stroke="#f2ad17" stroke-width="3"/><circle cx="600" cy="520" r="7" fill="#f2ad17"/>
<text x="600" y="565" text-anchor="middle" font-family="Noto Sans Devanagari, Mangal, sans-serif" font-size="31" fill="#10243a">विद्या संयुजते बुद्धिः, नवाचारः निर्मितिं भवति ।</text>
<text x="600" y="615" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="4" fill="#08264b">KNOWLEDGE CONNECTS MINDS, INNOVATION CREATES TOMORROW.</text>
