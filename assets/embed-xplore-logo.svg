<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Embed Xplore</title><desc id="desc">Circuit-inspired EX monogram in navy, teal and gold, with Sanskrit and English taglines.</desc>
